name: Android offline build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ikayi-yange-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JavaScript dependencies
        env:
          npm_config_fetch_retries: "5"
          npm_config_fetch_retry_mintimeout: "20000"
          npm_config_fetch_retry_maxtimeout: "120000"
          npm_config_fetch_timeout: "300000"
        run: |
          for i in 1 2 3; do
            npm install --no-audit --no-fund --legacy-peer-deps && exit 0
            echo "npm install failed (attempt $i), retrying..."
            sleep $((i * 15))
          done
          exit 1

      - name: Build the bundled native web app
        run: npm run build:native
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify the bundled entry point exists
        run: test -f .output/public/index.html

      - name: Create Android project
        run: npx cap add android

      - name: Prepare Ikayi Yange splash and icon assets
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          out = Path("assets")
          out.mkdir(exist_ok=True)
          for candidate in (
              Path("src/assets/ikayi-logo.png"),
              Path("public/favicon.png"),
              Path("public/icon-512.png"),
          ):
              if candidate.exists():
                  source = Image.open(candidate).convert("RGBA")
                  break
          else:
              source = Image.new("RGBA", (512, 512), (250, 248, 245, 255))
              draw = ImageDraw.Draw(source)
              draw.ellipse((64, 64, 448, 448), fill=(230, 120, 40, 255))

          source.resize((1024, 1024), Image.Resampling.LANCZOS).save(out / "icon-only.png")
          foreground = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
          mark = source.resize((900, 900), Image.Resampling.LANCZOS)
          foreground.alpha_composite(mark, ((1024 - mark.width) // 2, (1024 - mark.height) // 2))
          foreground.save(out / "icon-foreground.png")
          Image.new("RGBA", (1024, 1024), "#FAF8F5").save(out / "icon-background.png")

          splash = Image.new("RGBA", (2732, 2732), "#FAF8F5")
          mark = source.resize((560, 560), Image.Resampling.LANCZOS)
          splash.alpha_composite(mark, ((2732 - mark.width) // 2, (2732 - mark.height) // 2 - 70))
          draw = ImageDraw.Draw(splash)
          try:
              font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 112)
          except OSError:
              font = ImageFont.load_default()
          label = "Ikayi Yange"
          bounds = draw.textbbox((0, 0), label, font=font)
          draw.text(((2732 - (bounds[2] - bounds[0])) // 2, 1730), label, fill="#382B24", font=font)
          splash.save(out / "splash.png")
          splash.save(out / "splash-dark.png")
          PY

      - name: Copy bundled app into Android project
        run: npx cap sync android

      - name: Apply Ikayi branding to native Android launch screen and icon
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          res = Path("android/app/src/main/res")
          assets = Path("assets")
          splash = Image.open(assets / "splash.png").convert("RGBA")
          for folder in ("drawable", "drawable-nodpi", "drawable-land"):
              d = res / folder
              d.mkdir(parents=True, exist_ok=True)
              splash.save(d / "splash.png")

          logo = Image.open(assets / "icon-only.png").convert("RGBA")
          foreground = Image.open(assets / "icon-foreground.png").convert("RGBA")
          bg = Image.new("RGBA", (432, 432), (250, 248, 245, 255))
          for folder, size in [
              ("mipmap-mdpi", 108),
              ("mipmap-hdpi", 162),
              ("mipmap-xhdpi", 216),
              ("mipmap-xxhdpi", 324),
              ("mipmap-xxxhdpi", 432),
          ]:
              d = res / folder
              d.mkdir(parents=True, exist_ok=True)
              foreground.resize((size, size), Image.Resampling.LANCZOS).save(d / "ic_launcher_foreground.png")
              bg.resize((size, size), Image.Resampling.LANCZOS).save(d / "ic_launcher_background.png")
              logo.resize((size, size), Image.Resampling.LANCZOS).save(d / "ic_launcher.png")
              logo.resize((size, size), Image.Resampling.LANCZOS).save(d / "ic_launcher_round.png")

          anydpi = res / "mipmap-anydpi-v26"
          anydpi.mkdir(parents=True, exist_ok=True)
          adaptive = """<?xml version=\"1.0\" encoding=\"utf-8\"?>
<adaptive-icon xmlns:android=\"http://schemas.android.com/apk/res/android\">
    <background android:drawable=\"@mipmap/ic_launcher_background\"/>
    <foreground android:drawable=\"@mipmap/ic_launcher_foreground\"/>
</adaptive-icon>
"""
          for name in ("ic_launcher", "ic_launcher_round"):
              (anydpi / f"{name}.xml").write_text(adaptive)

          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "styles.xml").write_text("""<?xml version=\"1.0\" encoding=\"utf-8\"?>
<resources>
    <style name=\"AppTheme\" parent=\"Theme.AppCompat.Light.DarkActionBar\">
        <item name=\"colorPrimary\">#E87828</item>
        <item name=\"colorPrimaryDark\">#D45A12</item>
        <item name=\"colorAccent\">#E87828</item>
        <item name=\"android:statusBarColor\">#FAF8F5</item>
        <item name=\"android:navigationBarColor\">#FAF8F5</item>
        <item name=\"android:windowBackground\">@drawable/splash</item>
    </style>
    <style name=\"AppTheme.NoActionBar\" parent=\"Theme.AppCompat.DayNight.NoActionBar\">
        <item name=\"windowActionBar\">false</item>
        <item name=\"windowNoTitle\">true</item>
        <item name=\"android:windowBackground\">@drawable/splash</item>
        <item name=\"android:statusBarColor\">#FAF8F5</item>
        <item name=\"android:navigationBarColor\">#FAF8F5</item>
    </style>
    <style name=\"AppTheme.NoActionBarLaunch\" parent=\"Theme.SplashScreen\">
        <item name=\"android:windowBackground\">@drawable/splash</item>
        <item name=\"windowSplashScreenBackground\">#FAF8F5</item>
        <item name=\"windowSplashScreenAnimatedIcon\">@mipmap/ic_launcher_foreground</item>
        <item name=\"postSplashScreenTheme\">@style/AppTheme.NoActionBar</item>
    </style>
</resources>
""")
          PY

      - name: Verify Ikayi native branding assets
        run: |
          test -s android/app/src/main/res/drawable/splash.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload installable debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ikayi-yange-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download for the website
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Ikayi Yange Android" --notes "Direct Android APK download for Ikayi Yange. Beta build." --prerelease
          cp android/app/build/outputs/apk/debug/app-debug.apk ikayi-yange.apk
          gh release upload android-latest ikayi-yange.apk --clobber
